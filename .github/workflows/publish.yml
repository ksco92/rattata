name: publish

# On every push to main and on manual dispatch: publish the version in
# pyproject.toml to PyPI unless PyPI already has it. Publishing uses trusted
# publishing (OIDC); there is no stored token.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  UV_LOCKED: "1"
  PROJECT: max-lint

jobs:
  version_check:
    name: version check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          pypi_json=$(mktemp)
          status=$(curl -s --max-time 30 -o "$pypi_json" -w '%{http_code}' "https://pypi.org/pypi/$PROJECT/json")
          case "$status" in
            404) published=false ;;
            200) published=$(VERSION="$version" python3 -c 'import json, os, sys; print("true" if os.environ["VERSION"] in json.load(sys.stdin)["releases"] else "false")' < "$pypi_json") ;;
            *) echo "::error::PyPI answered $status for $PROJECT"; exit 1 ;;
          esac
          if [ "$published" = true ]; then skip=true; else skip=false; fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "$PROJECT $version published=$published"

  build:
    name: build
    needs: version_check
    if: github.ref == 'refs/heads/main' && needs.version_check.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.version_check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv run max-lint --check
      - run: uv build
      - name: check the wheel provides max-lint at the manifest version
        run: |
          set -euo pipefail
          venv=$(mktemp -d)/venv
          uv venv --python 3.13 "$venv"
          uv pip install --python "$venv/bin/python" dist/*.whl
          test "$("$venv/bin/max-lint" --version)" = "$PROJECT $VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: publish
    needs: [version_check, build]
    if: github.ref == 'refs/heads/main' && needs.version_check.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
