[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "max-lint"
version = "0.2.0"
description = "One command that runs black, isort, flake8, mypy and pytest with a single shared configuration."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "Rodrigo Carvajal" }]
keywords = ["lint", "linter", "black", "isort", "flake8", "mypy", "pytest", "coverage"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "black==26.10.1",
    "isort==9.0.2",
    "flake8==7.5.0",
    "mypy==2.4.1",
    "flake8-annotations==3.3.1",
    "flake8-docstrings==1.7.0",
    "flake8-rst-docstrings==0.4.0",
    "flake8-commas==4.0.0",
    "flake8-multiline-containers==0.0.19",
    "pydoclint[flake8]==0.12.0",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-socket==0.8.1",
    "coverage==7.17.3",
]

[project.urls]
Homepage = "https://github.com/ksco92/rattata"
Issues = "https://github.com/ksco92/rattata/issues"
Source = "https://github.com/ksco92/rattata"

[project.scripts]
max-lint = "max_lint.cli:main"
